<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="ig-grad" cx="20%" cy="105%" r="120%">
      <stop offset="0%" stop-color="#fdf497"/>
      <stop offset="10%" stop-color="#fdf497"/>
      <stop offset="35%" stop-color="#fd5949"/>
      <stop offset="55%" stop-color="#d6249f"/>
      <stop offset="90%" stop-color="#285AEB"/>
    </radialGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- macOS Squircle Body -->
  <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="url(#ig-grad)" filter="url(#shadow)"/>
  <!-- Top Glass Highlight -->
  <rect x="32" y="32" width="448" height="224" rx="100" ry="100" fill="url(#shine)"/>
  <!-- Inner Border Stroke -->
  <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>
  <!-- Instagram Camera Glyph (Enlarged & Bold) -->
  <rect x="101" y="101" width="310" height="310" rx="80" ry="80" fill="none" stroke="#ffffff" stroke-width="32"/>
  <circle cx="256" cy="256" r="76" fill="none" stroke="#ffffff" stroke-width="32"/>
  <circle cx="348" cy="164" r="18" fill="#ffffff"/>
</svg>
