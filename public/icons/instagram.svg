<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="ig-grad" cx="20%" cy="105%" r="120%">
      <stop offset="0%" stop-color="#fdf497"/>
      <stop offset="10%" stop-color="#fdf497"/>
      <stop offset="35%" stop-color="#fd5949"/>
      <stop offset="55%" stop-color="#d6249f"/>
      <stop offset="90%" stop-color="#285AEB"/>
    </radialGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- macOS Squircle Body -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#ig-grad)"/>
  <!-- Top Glass Highlight -->
  <rect x="0" y="0" width="512" height="256" rx="112" ry="112" fill="url(#shine)"/>
  <!-- Inner Border Stroke -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>
  <!-- Instagram Camera Glyph -->
  <rect x="96" y="96" width="320" height="320" rx="88" ry="88" fill="none" stroke="#ffffff" stroke-width="36"/>
  <circle cx="256" cy="256" r="84" fill="none" stroke="#ffffff" stroke-width="36"/>
  <circle cx="361" cy="152" r="22" fill="#ffffff"/>
</svg>
